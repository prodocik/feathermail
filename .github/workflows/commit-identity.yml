name: Commit identity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sole-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Reject outside pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'prodocik'
        run: |
          echo "This repository does not accept outside commits. Fork under the GPL."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repository history
        run: bash scripts/check-git-identity.sh all
