[package]
name = "feathermail"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Feather Mail — Linux-native mail client (GTK4/Relm4 shell)"

[[bin]]
name = "feathermail"
path = "src/main.rs"

[dependencies]
feathermail-attachments = { path = "../attachments" }
feathermail-core = { path = "../core" }
feathermail-html = { path = "../html" }
feathermail-notifications = { path = "../notifications" }
feathermail-search = { path = "../search" }
feathermail-security = { path = "../security" }
feathermail-service = { path = "../service" }
gtk4 = { version = "0.11", features = ["v4_10"] }
relm4 = "0.11"
webkit6 = "0.6"
serde_json = "1"
ureq = { version = "2.12", default-features = true, features = ["tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
