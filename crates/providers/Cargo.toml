[package]
name = "feathermail-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "IMAP/SMTP provider trait and implementations"

[dependencies]
feathermail-core = { path = "../core" }
feathermail-attachments = { path = "../attachments" }
feathermail-sync = { path = "../sync" }
feathermail-security = { path = "../security" }
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
native-tls = "0.2"
roxmltree = "0.20"
sha2 = "0.10"
simple-dns = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[features]
# T-082: opens up `test_support` (the shared fake IMAP server) to an
# external consumer's own tests -- see that module's doc comment. Adds
# nothing to a normal build; only this crate's own `#[cfg(test)]` builds
# and an explicit opt-in like `crates/service`'s `[dev-dependencies]` pull
# it in.
test-support = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
